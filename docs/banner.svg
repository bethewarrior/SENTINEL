<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" font-family="'SFMono-Regular','Cascadia Code','Consolas','Liberation Mono',monospace" role="img" aria-label="SENTINEL live system dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#090c10"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39c5cf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39c5cf" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#8b7fff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .t   { fill:#e6edf3; font-size:15px; }
      .dim { fill:#8b949e; font-size:13px; }
      .lbl { fill:#7d8590; font-size:14px; letter-spacing:1px; }
      .grn { fill:#3fb950; } .yel { fill:#d29922; } .red { fill:#f85149; }
      .cyn { fill:#39c5cf; } .mag { fill:#bc8cff; } .b { font-weight:700; }
      .mono{ font-size:15px; }
      .track { fill:#21262d; }
    </style>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="858" height="518" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="857" height="3" rx="1.5" fill="url(#glow)"/>

  <!-- title bar -->
  <rect x="1.5" y="1.5" width="857" height="40" rx="12" fill="#161b22"/>
  <rect x="1.5" y="30" width="857" height="12" fill="#161b22"/>
  <circle cx="26" cy="22" r="6" fill="#f85149"/>
  <circle cx="48" cy="22" r="6" fill="#d29922"/>
  <circle cx="70" cy="22" r="6" fill="#3fb950"/>
  <text x="430" y="27" text-anchor="middle" class="dim">node --experimental-strip-types sentinel.ts</text>

  <!-- header -->
  <text x="28" y="74" class="t b" font-size="19">SENTINEL</text>
  <text x="132" y="74" class="dim">zero-import system health sentinel</text>
  <text x="28" y="98" class="dim">node v22.17.0 · pid 4776 · mode tui · every 700ms · 0 deps · 0 imports</text>

  <!-- health -->
  <text x="28" y="134" class="lbl">HEALTH</text>
  <text x="110" y="134" class="grn b mono">A</text>
  <text x="132" y="134" class="t mono">100/100</text>
  <rect x="232" y="121" width="52" height="19" rx="4" fill="#1b3a23"/>
  <text x="240" y="135" class="grn b" font-size="13">OK</text>
  <!-- health flips to WARN when loop-lag trips, then back -->
  <g>
    <rect x="232" y="121" width="64" height="19" rx="4" fill="#3a2f12">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.45;0.55;0.65;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="240" y="135" class="yel b" font-size="13" opacity="0">WARN
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.45;0.55;0.65;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- CPU -->
  <text x="28" y="174" class="lbl">CPU</text>
  <rect x="92" y="162" width="300" height="15" rx="3" class="track"/>
  <rect x="92" y="162" height="15" rx="3" fill="#3fb950">
    <animate attributeName="width" values="70;150;110;200;70" keyTimes="0;0.25;0.5;0.75;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#3fb950;#d29922;#3fb950;#d29922;#3fb950" keyTimes="0;0.25;0.5;0.75;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <g class="t mono">
    <text x="404" y="175">23%<animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="404" y="175">50%<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="404" y="175">37%<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="404" y="175">66%<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="6s" repeatCount="indefinite"/></text>
  </g>
  <!-- per-core heatmap: 12 cells, each pulsing among shades -->
  <g>
    <rect x="470" y="162" width="13" height="15" rx="2" fill="#1f6f33"><animate attributeName="fill" values="#16331f;#2ea043;#d29922;#1f6f33;#16331f" dur="3.1s" repeatCount="indefinite"/></rect>
    <rect x="486" y="162" width="13" height="15" rx="2" fill="#2ea043"><animate attributeName="fill" values="#2ea043;#16331f;#1f6f33;#d29922;#2ea043" dur="3.7s" repeatCount="indefinite"/></rect>
    <rect x="502" y="162" width="13" height="15" rx="2" fill="#16331f"><animate attributeName="fill" values="#1f6f33;#d29922;#16331f;#2ea043;#1f6f33" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="518" y="162" width="13" height="15" rx="2" fill="#1f6f33"><animate attributeName="fill" values="#16331f;#1f6f33;#f85149;#2ea043;#16331f" dur="4.3s" repeatCount="indefinite"/></rect>
    <rect x="534" y="162" width="13" height="15" rx="2" fill="#2ea043"><animate attributeName="fill" values="#2ea043;#d29922;#1f6f33;#16331f;#2ea043" dur="3.3s" repeatCount="indefinite"/></rect>
    <rect x="550" y="162" width="13" height="15" rx="2" fill="#16331f"><animate attributeName="fill" values="#16331f;#2ea043;#16331f;#1f6f33;#16331f" dur="2.9s" repeatCount="indefinite"/></rect>
    <rect x="566" y="162" width="13" height="15" rx="2" fill="#1f6f33"><animate attributeName="fill" values="#1f6f33;#16331f;#d29922;#2ea043;#1f6f33" dur="3.9s" repeatCount="indefinite"/></rect>
    <rect x="582" y="162" width="13" height="15" rx="2" fill="#2ea043"><animate attributeName="fill" values="#2ea043;#1f6f33;#16331f;#f85149;#2ea043" dur="4.6s" repeatCount="indefinite"/></rect>
    <rect x="598" y="162" width="13" height="15" rx="2" fill="#16331f"><animate attributeName="fill" values="#16331f;#2ea043;#1f6f33;#d29922;#16331f" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="614" y="162" width="13" height="15" rx="2" fill="#1f6f33"><animate attributeName="fill" values="#1f6f33;#d29922;#2ea043;#16331f;#1f6f33" dur="3.5s" repeatCount="indefinite"/></rect>
    <rect x="630" y="162" width="13" height="15" rx="2" fill="#2ea043"><animate attributeName="fill" values="#2ea043;#16331f;#1f6f33;#2ea043;#2ea043" dur="4.0s" repeatCount="indefinite"/></rect>
    <rect x="646" y="162" width="13" height="15" rx="2" fill="#16331f"><animate attributeName="fill" values="#16331f;#1f6f33;#d29922;#2ea043;#16331f" dur="3.0s" repeatCount="indefinite"/></rect>
  </g>
  <text x="680" y="174" class="dim">12 cores</text>
  <text x="92" y="198" class="dim">11th Gen Intel(R) Core(TM) i5-11400H @ 2.70GHz</text>

  <!-- MEM -->
  <text x="28" y="232" class="lbl">MEM</text>
  <rect x="92" y="220" width="300" height="15" rx="3" class="track"/>
  <rect x="92" y="220" width="231" height="15" rx="3" fill="#d29922">
    <animate attributeName="width" values="228;234;231;236;228" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="404" y="232" class="t mono">77%</text>
  <text x="470" y="232" class="dim">12.1 GB / 15.7 GB · rss 56 MB</text>

  <!-- HEAP -->
  <text x="28" y="266" class="lbl">HEAP</text>
  <rect x="92" y="254" width="300" height="15" rx="3" class="track"/>
  <rect x="92" y="254" width="3" height="15" rx="2" fill="#3fb950"/>
  <text x="404" y="266" class="t mono">0.2%</text>
  <text x="470" y="266" class="dim">9.4 MB / 4.0 GB · procCPU 31%</text>

  <!-- LOOP + sparkline -->
  <text x="28" y="300" class="lbl">LOOP</text>
  <g fill="#39c5cf">
    <rect x="92"  y="294" width="7" height="6"><animate attributeName="height" values="4;6;5;8;4" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="296;294;295;292;296" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="103" y="282" width="7" height="18"><animate attributeName="height" values="6;18;9;14;6" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="294;282;291;286;294" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="114" y="290" width="7" height="10"><animate attributeName="height" values="18;10;13;7;18" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="282;290;287;293;282" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="125" y="296" width="7" height="4"><animate attributeName="height" values="10;4;8;11;10" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="290;296;292;289;290" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="136" y="292" width="7" height="8"><animate attributeName="height" values="4;8;6;9;4" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="296;292;294;291;296" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="147" y="288" width="7" height="12"><animate attributeName="height" values="8;12;7;13;8" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="292;288;293;287;292" dur="4s" repeatCount="indefinite"/></rect>
  </g>
  <g class="mono">
    <text x="172" y="300" class="cyn">14 ms<animate attributeName="opacity" values="1;0;1;0;1" keyTimes="0;0.45;0.55;0.65;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="172" y="300" class="yel" opacity="0">76 ms<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.45;0.55;0.65;1" dur="9s" repeatCount="indefinite"/></text>
  </g>
  <text x="260" y="300" class="dim">HANDLES 12</text>
  <text x="360" y="300" class="yel">(9 zombie)</text>

  <!-- divider -->
  <line x1="28" y1="324" x2="832" y2="324" stroke="#21262d" stroke-width="1"/>
  <text x="28" y="348" class="lbl">EVENTS</text>

  <!-- streaming events fade in over time -->
  <text x="92" y="348" class="mag">◴ FORECAST  memory +6.2%/min → crit in ~4m10s
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.15;0.3;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="92" y="374" class="yel">▲ OPEN      loop-lag 76ms ≥ 50ms  ·  incident #1
    <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.4;0.5;0.55;0.85;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="92" y="374" class="grn">▼ RESOLVED  loop-lag after 2.1s  ·  MTTR logged
    <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.85;0.9;0.95;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="92" y="400" class="cyn">✶ ANOMALY   cpu z=3.4 (EWMA baseline, no fixed threshold)
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.35;0.6;0.7;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="92" y="426" class="cyn">✦ CLEAN     gc freed 3.1 MB  ·  history trimmed to cap
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.7;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- footer hint -->
  <line x1="28" y1="452" x2="832" y2="452" stroke="#21262d" stroke-width="1"/>
  <text x="28" y="478" class="dim">monitor → health-checks → automation → cleaner   ·   one file · 605 lines · 0 dependencies</text>
  <text x="28" y="500" class="dim">Ctrl+C to quit · forecasts, anomalies &amp; incidents stream live<tspan class="grn"> ▌</tspan>
    <animate attributeName="opacity" values="1;1;0.2;1" dur="1.1s" repeatCount="indefinite"/>
  </text>
</svg>
